name: Linux Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-packages:
    name: Linux Packages (.tar.gz, .deb, .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libdbus-1-dev libgtk-3-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release Binary
        run: cargo build --release
      - name: Build Tarball (install.sh + uninstall.sh)
        run: |
          VERSION=$(grep -oP '^version = "\K[^"]+' Cargo.toml | head -1)
          bash Release/linux/build-tarball.sh <<< "$VERSION"
      - name: Install Packaging Tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      - name: Build DEB
        run: cargo deb
      - name: Build RPM
        run: cargo generate-rpm
      - name: Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            Release/artifacts/*.tar.gz
            target/debian/*.deb
            target/generate-rpm/*.rpm
          token: ${{ secrets.GITHUB_TOKEN }}
